<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Feedback</title>
<link rel="stylesheet" href="coun.css">
   
</head>
<body>

<div class="container">

    <h2>Feedback</h2>

    <form>

        <div class="row">
            <label>Subject</label>
            <input type="text" name="subject" required>
        </div>

        <div class="row">
            <label>Teacher</label>
            <input type="text" name="teacher" required>
        </div>

        <div class="row">
            <label>Feedback</label>
            <textarea placeholder="Write Your Feedback..." required></textarea>
        </div>

        <div class="buttons">
            <button type="submit">Submit</button>
        </div>

    </form>

</div>

</body>
</html>
