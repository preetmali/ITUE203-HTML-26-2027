<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Profile</title>
<link rel="stylesheet" href="profile.css"></head>
<body>

    <div class="container">

        <div class="heading">
            <h1>Profile</h1>
        </div>

        <form action="dashboard.html">

            <div class="profile">


                <div class="left">

                    <div class="row">
                        <label>Student ID</label>
                        <input type="text" required>
                    </div>

                    <div class="row">
                        <label>Name</label>
                        <input type="text" required>
                    </div>

                    <div class="row">
                        <label>Birth Date</label>
                        <input type="date" required>
                    </div>

                    <div class="row">
                        <label>Gender</label>
                        <select rrequired>
                            <option>Select</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="row">
                        <label>University/<br>Institute/<br>Program</label>
                        <textarea required></textarea>
                    </div>

                    <div class="row">
                        <label>Email</label>
                        <input type="email" required>
                    </div>

                    <div class="row">
                        <label>Mobile Number</label>
                        <input type="text" required>
                    </div>

                    <div class="row">
                        <label>Address</label>
                        <textarea required></textarea>
                    </div>

                </div>


                <div class="right">
                    <div class="photo">
                        Photo
                    </div>
                </div>

            </div>

            <div class="buttons">
                <button type="button">Save as</button>
                <button type="submit">Submit</button>
            </div>
     <script>
        
     </script>
        </form>

    </div>

</body>

</html>
